name: Build Flatpak

on:
  workflow_dispatch:

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      - name: Setup GPG
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        env:
          MPVQC_BUILD_CHANNEL: ${{ github.repository == 'mpvqc/mpvQC-flatpak' && github.ref == 'refs/heads/main' && 'mpvqc-flatpak' || '' }}
        with:
          manifest-path: io.github.mpvqc.mpvQC.yml
          bundle: io.github.mpvqc.mpvQC.flatpak
          artifact-name: io.github.mpvqc.mpvQC-x86_64
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}

      # Existing installs follow the repository at the Pages root, so the build
      # output is published as is, next to the files that describe the remote.
      - name: Prepare Pages content
        run: |
          cp mpvQC.flatpakref index.flatpakrepo repo/
          chmod -R +rX repo

      # Uploaded on every branch so a build can be inspected before it ships.
      # Only the deploy job below publishes it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

  deploy:
    name: Deploy
    if: ${{ github.ref == 'refs/heads/main' }}

    needs: flatpak
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
