name: Build Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup GPG
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        env:
          MPVQC_BUILD_CHANNEL: ${{ github.repository == 'mpvqc/mpvQC-flatpak' && github.ref == 'refs/heads/main' && 'mpvqc-flatpak' || '' }}
        with:
          manifest-path: io.github.mpvqc.mpvQC.yml
          bundle: io.github.mpvqc.mpvQC.flatpak
          artifact-name: io.github.mpvqc.mpvQC-x86_64
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}

      # Existing installs follow the repository at the Pages root, so the build
      # output is published as is, next to the files that describe the remote.
      - name: Prepare Pages content
        run: |
          cp mpvQC.flatpakref index.flatpakrepo repo/
          chmod -R +rX repo

      # Uploaded on every branch so a build can be inspected before it ships.
      # Only the deploy job below publishes it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo

  deploy:
    name: Deploy
    if: ${{ github.ref == 'refs/heads/main' }}

    needs: flatpak
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
