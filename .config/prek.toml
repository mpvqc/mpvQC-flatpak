# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.11.2"
hooks = [
    {
        id = "tombi-format",
        name = "format toml",
        args = [
            "--offline",
        ]
    },
]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.6.7"
hooks = [
    {
        id = "biome-check",
        name = "format json, yml",
        files = '\.(jsonc?|ya?ml)$',
        exclude = '^\.config/biome\.jsonc$',
        args = ["--config-path=.config"],
    },
]

[[repos]]
repo = "https://github.com/Mateusz-Grzelinski/actionlint-py"
rev = "v1.7.12.25"
hooks = [
    {
        id = "actionlint",
        name = "lint workflows",
        # actionlint checks `run:` scripts only when it finds shellcheck
        additional_dependencies = ["shellcheck-py==0.11.0.1"],
    },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.32.0"
hooks = [
    {
        id = "zizmor",
        name = "audit workflows",
        args = ["--no-progress", "--offline"],
    },
]

[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "1.0.0"
hooks = [
    {
        id = "mdformat",
        name = "format md",
        exclude = ".github/",
        args = ["--number", "--wrap", "keep", "--end-of-line", "lf"],
        additional_dependencies = [
            "mdformat-gfm",
        ]
    },
]
